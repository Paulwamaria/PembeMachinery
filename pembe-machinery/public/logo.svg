<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Pembe Machinery and Fabricator logo</title>
  <desc id="desc">A purple gear with a magenta gazelle head and green swooshes, with the words Pembe Machinery and Fabricator.</desc>

  <defs>
    <linearGradient id="gazelleGrad" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#d11f86"/>
      <stop offset="100%" stop-color="#8f0f7e"/>
    </linearGradient>
    <style>
      .brand { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: 1px; }
      .small { font-size: 72px; }
      .big { font-size: 118px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1400" height="700" fill="#ffffff"/>

  <!-- gear -->
  <g transform="translate(700 350)">
    <circle r="178" fill="none" stroke="#5B2CA3" stroke-width="78"/>
    <g fill="#5B2CA3">
      <rect x="-42" y="-286" width="84" height="90" rx="8"/>
      <rect x="-42" y="196" width="84" height="90" rx="8"/>
      <rect x="-286" y="-42" width="90" height="84" rx="8"/>
      <rect x="196" y="-42" width="90" height="84" rx="8"/>

      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(45)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(90)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(135)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(180)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(225)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(270)"/>
      <rect x="-42" y="-286" width="84" height="90" rx="8" transform="rotate(315)"/>
    </g>

    <!-- white ring -->
    <circle r="182" fill="none" stroke="#ffffff" stroke-width="24"/>

    <!-- swooshes -->
    <path d="M-308 -8 C-220 -75, -95 -90, 18 -56 C95 -34, 166 4, 308 0
             L308 16 C180 12, 110 -2, 25 18 C-110 51, -219 38, -308 16 Z"
          fill="#2DBE3F"/>
    <path d="M-296 4 C-205 -30, -120 -24, -22 7 C86 42, 190 34, 296 12"
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

    <!-- gazelle head -->
    <g transform="translate(0 12)">
      <path d="M-74 -104
               C-48 -83, -36 -60, -33 -28
               C-24 -62, -12 -79, 10 -98
               C34 -118, 48 -145, 47 -172
               C66 -147, 78 -122, 83 -90
               C91 -43, 84 5, 57 59
               C37 99, 13 126, -26 142
               C-63 156, -98 154, -130 136
               C-100 122, -83 95, -77 59
               C-98 83, -115 95, -141 98
               C-131 78, -122 55, -118 29
               C-136 16, -146 3, -155 -20
               C-136 -15, -121 -6, -106 8
               C-109 -19, -107 -47, -102 -70
               C-97 -92, -86 -106, -74 -104 Z"
            fill="url(#gazelleGrad)" stroke="#5B2CA3" stroke-width="4"/>

      <path d="M-2 26 C43 22, 74 44, 88 88" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <path d="M65 -28 C50 -11, 49 19, 71 39" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <path d="M18 102 C33 100, 43 108, 55 124" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="85" y="394" class="brand big" fill="#5B2CA3">PEMBE</text>
  <text x="760" y="394" class="brand big" fill="#5B2CA3">MACHINERY</text>
  <text x="150" y="532" class="brand small" fill="#5B2CA3">AND</text>
  <text x="815" y="532" class="brand small" fill="#5B2CA3">FABRICATOR</text>

  <!-- subtle green rule -->
  <path d="M154 305 C314 292, 414 293, 552 302" stroke="#2DBE3F" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M848 305 C1002 300, 1122 301, 1263 307" stroke="#2DBE3F" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
